name: Pruebas con Emulador de Android

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    name: Ejecutar pruebas instrumentadas
    runs-on: macos-14 # Servidor actualizado a Apple Silicon (M1)

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Expo CLI
        run: npm install -g expo eas-cli

      - name: Prebuild Android
        run: npx expo prebuild --platform android --non-interactive

      - name: Instalar Android SDK y generar Emulador
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: arm64-v8a # Cambiado a ARM64 para que funcione en el nuevo macOS
          profile: Nexus 6
          script: ./gradlew connectedCheck


      - name: Export and Run Android
        run: |
          npx expo export
          npx expo run:android --variant release

      - name: Verify APK
        run: find . -name "*.apk"

      

