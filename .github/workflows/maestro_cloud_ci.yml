name: Build Debug APK and run Maestro tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  maestro-cloud:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ======================
      # NODE
      # ======================
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # ======================
      # JAVA
      # ======================
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      # ======================
      # EXPO PREBUILD
      # ======================
      - name: Prebuild Android
        run: npx expo prebuild --platform android --non-interactive

      # ======================
      # ENSURE ASSETS FOLDER EXISTS
      # ======================
      - name: Create assets folder
        run: mkdir -p android/app/src/main/assets

      # ======================
      # MANUAL BUNDLE (CRITICAL STEP)
      # ======================
      - name: Bundle React Native JS
        run: |
          npx react-native bundle \
            --platform android \
            --dev false \
            --entry-file index.js \
            --bundle-output android/app/src/main/assets/index.android.bundle \
            --assets-dest android/app/src/main/res

      # ======================
      # GRADLE PERMISSIONS
      # ======================
      - name: Make Gradlew executable
        run: chmod +x android/gradlew

      # ======================
      # CLEAN BUILD
      # ======================
      - name: Clean Android build
        run: |
          cd android
          ./gradlew clean

      # ======================
      # BUILD DEBUG APK
      # ======================
      - name: Build Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      # ======================
      # VERIFY APK
      # ======================
      - name: Verify APK
        run: find android/app/build/outputs/apk -name "*.apk"

      # ======================
      # MAESTRO CLOUD
      # ======================
      - name: Run Maestro Cloud tests
        uses: mobile-dev-inc/action-maestro-cloud@v3.0.0
        with:
          api-key: ${{ secrets.MAESTRO_API_KEY }}
          project-id: ${{ secrets.MAESTRO_PROJECT_ID }}
          app-file: android/app/build/outputs/apk/debug/app-debug.apk