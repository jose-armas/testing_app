name: Build Debug APK and run Maestro tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  maestro-cloud:
    runs-on: ubuntu-latest

    steps:
      # ======================
      # CHECKOUT
      # ======================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ======================
      # NODE
      # ======================
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # ======================
      # FIX CLI (IMPORTANT)
      # ======================
      - name: Install React Native CLI dependency
        run: npm install -D @react-native-community/cli

      # ======================
      # JAVA
      # ======================
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      # ======================
      # EXPO PREBUILD
      # ======================
      - name: Prebuild Android
        run: npx expo prebuild --platform android --non-interactive

      # ======================
      # GRADLE PERMISSIONS
      # ======================
      - name: Make Gradlew executable
        run: chmod +x android/gradlew

      # ======================
      # CREATE ASSETS FOLDER
      # ======================
      - name: Create Android assets folder
        run: mkdir -p android/app/src/main/assets/

      # ======================
      # CREATE EMPTY BUNDLE FILE
      # ======================
      - name: Create bundle file
        run: |
          cd android/app/src/main/assets/
          touch index.android.bundle
          cd ../../../..

      # ======================
      # BUNDLE JS (FIXED)
      # ======================
      - name: Bundle React Native JS
        run: |
          npx react-native bundle \
            --platform android \
            --dev false \
            --entry-file index.js \
            --bundle-output android/app/src/main/assets/index.android.bundle \
            --assets-dest android/app/src/main/res

      # ======================
      # CLEAN OLD BUILD
      # ======================
      - name: Remove existing build
        run: rm -rf android/app/build

      # ======================
      # BUILD DEBUG APK
      # ======================
      - name: Build Debug APK
        run: |
          cd android
          ./gradlew clean assembleDebug --stacktrace
          cd ..

      # ======================
      # VERIFY APK
      # ======================
      - name: Verify APK
        run: find android/app/build/outputs/apk -name "*.apk"

      # ======================
      # MAESTRO CLOUD TESTS
      # ======================
      - name: Run Maestro Cloud tests
        uses: mobile-dev-inc/action-maestro-cloud@v3.0.0
        with:
          api-key: ${{ secrets.MAESTRO_API_KEY }}
          project-id: ${{ secrets.MAESTRO_PROJECT_ID }}
          app-file: android/app/build/outputs/apk/debug/app-debug.apk