name: Build and run Maestro tests (Native Android)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  maestro-cloud:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Locate Android project
        id: locate
        run: |
          set -e
          gradlew_path=$(find . -type f -path '*/android/gradlew' | head -n 1)

          if [ -z "$gradlew_path" ]; then
            echo "No se encontro ningun archivo android/gradlew en el repositorio"
            find . -maxdepth 3 -type d | sort
            exit 1
          fi

          project_dir=$(dirname "$(dirname "$gradlew_path")")
          if [ "$project_dir" = "." ]; then
            apk_path="android/app/build/outputs/apk/debug/app-debug.apk"
          else
            apk_path="$project_dir/android/app/build/outputs/apk/debug/app-debug.apk"
          fi

          echo "project_dir=$project_dir" >> "$GITHUB_OUTPUT"
          echo "apk_path=$apk_path" >> "$GITHUB_OUTPUT"

      - name: Ensure Gradle wrapper is executable
        run: chmod +x ${{ steps.locate.outputs.project_dir }}/android/gradlew

      - name: Build Android debug APK
        run: ${{ steps.locate.outputs.project_dir }}/android/gradlew assembleDebug

      - uses: mobile-dev-inc/action-maestro-cloud@v2
        with:
          api-key: ${{ secrets.MAESTRO_API_KEY }}
          project-id: ${{ secrets.MAESTRO_PROJECT_ID }}
          app-file: ${{ steps.locate.outputs.apk_path }}