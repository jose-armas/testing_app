name: Build Debug APK and run Maestro tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  maestro-cloud:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      # Generate native android project from Expo
      - name: Expo prebuild
        run: npx expo prebuild --platform android --non-interactive

      # IMPORTANT:
      # Embed JS bundle inside APK
      # This avoids Metro dependency in Maestro Cloud
      - name: Embed JS bundle
        run: npx expo export:embed --platform android

      # Build debug APK
      - name: Build Debug APK
        run: |
          cd android
          ./gradlew assembleDebug

      - name: Verify APK
        run: find android/app/build/outputs/apk -name "*.apk"

      - name: Run Maestro Cloud tests
        uses: mobile-dev-inc/action-maestro-cloud@v3.0.0
        with:
          api-key: ${{ secrets.MAESTRO_API_KEY }}
          project-id: ${{ secrets.MAESTRO_PROJECT_ID }}
          app-file: android/app/build/outputs/apk/debug/app-debug.apk