name: Maestro Cloud CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: maestro-cloud-${{ github.ref }}
  cancel-in-progress: true

jobs:
  maestro-cloud:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Ensure Gradle wrapper is executable
        run: chmod +x android/gradlew

      - name: Build Android release APK
        run: ./android/gradlew assembleRelease

      - name: Run Maestro tests on Maestro Cloud
        uses: mobile-dev-inc/action-maestro-cloud@v2
        with:
          api-key: ${{ secrets.MAESTRO_API_KEY }}
          project-id: ${{ secrets.MAESTRO_PROJECT_ID }}
          app-file: android/app/build/outputs/apk/release/app-release.apk