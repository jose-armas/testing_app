name: Build Release APK and run Maestro tests
on:
  pull_request:
    branches:
      - 'release/**'

jobs:
  maestro-cloud:
    name: Build Release APK and run Maestro tests
    runs-on: ubuntu-latest
  
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          java-version: 17
          distribution: 'temurin'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Expo CLI
        run: npm install -g expo eas-cli

      - name: Install Metro dependency (fix CI)
        run: npx expo install @react-native/metro-config

      - name: Prebuild Android
        run: npx expo prebuild --platform android --non-interactive

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease
    
      - name: Verify APK
        run: find . -name "*.apk"

      - name: Run Maestro Cloud tests
        uses: mobile-dev-inc/action-maestro-cloud@v3.0.0
        with:
          api-key: ${{ secrets.MAESTRO_API_KEY }}
          project-id: ${{ secrets.MAESTRO_PROJECT_ID }}
          app-file: android/app/build/outputs/apk/release/app-release.apk